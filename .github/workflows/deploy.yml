name: Deploy to Production

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 10m
          script: |
            set -e
            cd ${{ secrets.PROJECT_PATH }}

            echo "=== 拉取最新程式碼 ==="
            OLD_HEAD=$(git rev-parse HEAD)
            git pull origin ${{ github.ref_name }}

            # backend.conf 是單檔 bind mount，git 更新會換 inode，容器需重建才會讀到新設定
            if ! git diff --quiet "$OLD_HEAD" HEAD -- docker/nginx/backend.conf; then
              echo "=== backend.conf 有變更，重建 backend-nginx ==="
              docker compose up -d --no-deps --force-recreate backend-nginx
            fi

            # 後端程式碼是 volume 掛載，pull 後立即生效，所以先讓 DB schema 跟上
            echo "=== 執行資料庫遷移 ==="
            bash scripts/migrate.sh

            echo "=== 主機資源（供 build 卡住時診斷） ==="
            free -h || true
            df -h . || true

            echo "=== 執行前端部署 ==="
            bash scripts/deploy-frontend.sh

            echo "=== 部署完成 ==="
