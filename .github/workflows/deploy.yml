name: Deploy to Production

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 10m
          script: |
            set -e
            cd ${{ secrets.PROJECT_PATH }}

            echo "=== 拉取最新程式碼 ==="
            OLD_HEAD=$(git rev-parse HEAD)
            git pull origin ${{ github.ref_name }}

            # backend.conf 是單檔 bind mount，git 更新會換 inode，容器需重建才會讀到新設定
            if ! git diff --quiet "$OLD_HEAD" HEAD -- docker/nginx/backend.conf; then
              echo "=== backend.conf 有變更，重建 backend-nginx ==="
              docker compose up -d --no-deps --force-recreate backend-nginx
            fi

            # 環境變數、port 綁定只在容器建立時讀取，compose 有變更時要重建才會生效
            # （前端由藍綠部署腳本負責，這裡不動 frontend/proxy）
            if ! git diff --quiet "$OLD_HEAD" HEAD -- docker-compose.yml; then
              echo "=== docker-compose.yml 有變更，重建 php / db / phpmyadmin ==="
              docker compose up -d --no-deps --no-build php db phpmyadmin
              # php 容器的 entrypoint 會先 composer install 再 exec php-fpm，
              # 等 PID 1 變成 php-fpm 才代表跑完，避免與下一步的 composer install 撞在一起
              ready=0
              for i in $(seq 1 90); do
                if docker compose exec -T php sh -c 'grep -q php-fpm /proc/1/cmdline' 2>/dev/null \
                  && docker compose exec -T db mysqladmin ping -h 127.0.0.1 --silent >/dev/null 2>&1; then
                  ready=1; break
                fi
                sleep 2
              done
              if [ "$ready" != "1" ]; then
                echo "✗ php 或 db 容器 180 秒內未就緒"
                docker compose logs --tail=50 php db
                exit 1
              fi
            fi
            echo "=== 後端執行環境：$(docker compose exec -T php printenv CI_ENVIRONMENT) ==="

            # vendor/ 不在 git 內，容器啟動時才會 composer install；
            # 部署時不重啟 php 容器，所以要在這裡讓 vendor 跟 composer.lock 同步
            echo "=== 同步後端 composer 套件 ==="
            docker compose exec -T php composer install --no-dev --optimize-autoloader --no-interaction

            # 後端程式碼是 volume 掛載，pull 後立即生效，所以先讓 DB schema 跟上
            echo "=== 執行資料庫遷移 ==="
            bash scripts/migrate.sh

            echo "=== 主機資源（供 build 卡住時診斷） ==="
            free -h || true
            df -h . || true

            echo "=== 執行前端部署 ==="
            bash scripts/deploy-frontend.sh

            echo "=== 部署完成 ==="
